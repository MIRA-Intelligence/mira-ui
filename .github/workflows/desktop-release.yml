name: Desktop Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS artifacts
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac

      - name: Build Windows artifacts
        if: matrix.os == 'windows-latest'
        run: npm run dist:win

      - name: Upload macOS release assets
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: medpilotui-macos
          path: |
            release/MedPilotUI-*-mac-*.dmg
            release/MedPilotUI-*-mac-*.dmg.blockmap
            release/MedPilotUI-*-mac-*.zip
            release/MedPilotUI-*-mac-*.zip.blockmap
            release/latest-mac.yml
            release/app-update.yml

      - name: Upload Windows release assets
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: medpilotui-windows
          path: |
            release/MedPilotUI-*-win-*.exe
            release/MedPilotUI-*-win-*.exe.blockmap
            release/latest.yml
            release/app-update.yml

  publish-release:
    needs: build-desktop
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: medpilotui-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.dmg.blockmap
            release-assets/*.zip
            release-assets/*.zip.blockmap
            release-assets/*.exe
            release-assets/*.exe.blockmap
            release-assets/latest*.yml
            release-assets/app-update.yml
