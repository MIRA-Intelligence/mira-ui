name: Desktop Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align package version with release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'EOF'
          const fs = require('fs')

          const tag = process.env.RELEASE_TAG || ''
          const match = /^v(\d+\.\d+\.\d+)(?:rc(\d+))?$/.exec(tag)
          if (!match) {
            console.error(`Unsupported tag format: "${tag}". Expected vX.Y.Z or vX.Y.ZrcN.`)
            process.exit(1)
          }

          const version = match[2] ? `${match[1]}-rc.${match[2]}` : match[1]
          const pkgPath = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))
          pkg.version = version
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`)

          if (process.env.GITHUB_ENV) {
            fs.appendFileSync(process.env.GITHUB_ENV, `DESKTOP_VERSION=${version}\n`)
          }

          console.log(`Set ${pkgPath} version to ${version} from tag ${tag}`)
          EOF

      - name: Show resolved desktop version
        run: echo "Desktop version = ${{ env.DESKTOP_VERSION }}"

      - name: Build macOS artifacts
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac

      - name: Build Windows artifacts
        if: matrix.os == 'windows-latest'
        run: npm run dist:win

      - name: Package Windows setup and portable executables as zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $setupExe = Get-ChildItem -Path release -Filter "MIRA-*-win-*-setup.exe" | Select-Object -First 1
          if (-not $setupExe) {
            Write-Error "Setup executable not found in release/"
            exit 1
          }
          $setupZip = [System.IO.Path]::ChangeExtension($setupExe.FullName, ".zip")
          Compress-Archive -Path $setupExe.FullName -DestinationPath $setupZip -Force

          $portableExe = Get-ChildItem -Path release -Filter "MIRA-*-win-*-portable.exe" | Select-Object -First 1
          if (-not $portableExe) {
            Write-Error "Portable executable not found in release/"
            exit 1
          }
          $portableZip = [System.IO.Path]::ChangeExtension($portableExe.FullName, ".zip")
          Compress-Archive -Path $portableExe.FullName -DestinationPath $portableZip -Force

      - name: Upload macOS release assets
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: miraui-macos
          path: |
            release/MIRA-*-mac-*.dmg
            release/MIRA-*-mac-*.dmg.blockmap
            release/MIRA-*-mac-*.zip
            release/MIRA-*-mac-*.zip.blockmap
            release/latest-mac.yml
            release/app-update.yml

      - name: Upload Windows release assets
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: miraui-windows
          path: |
            release/MIRA-*-win-*-setup.zip
            release/MIRA-*-win-*-portable.zip

  publish-release:
    needs: build-desktop
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: miraui-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.dmg.blockmap
            release-assets/*.zip
            release-assets/*.zip.blockmap
            release-assets/latest*.yml
            release-assets/app-update.yml
