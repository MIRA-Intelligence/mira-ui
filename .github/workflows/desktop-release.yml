name: Desktop Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version to rehearse (build only, e.g. v0.4.5rc1)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write

jobs:
  verify-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate compatibility.json schema
        run: node scripts/validate-compatibility.mjs --file compatibility.json

      - name: Release version must match compatibility.json#ui
        shell: bash
        run: |
          node scripts/validate-compatibility.mjs \
            --file compatibility.json \
            --require-ui "${RELEASE_TAG#v}"

  build-standalone:
    needs: verify-compatibility
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align package version with release tag
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('fs')

          const tag = process.env.RELEASE_TAG || ''
          const match = /^v(\d+\.\d+\.\d+)(?:rc(\d+))?$/.exec(tag)
          if (!match) {
            console.error(`Unsupported tag format: "${tag}". Expected vX.Y.Z or vX.Y.ZrcN.`)
            process.exit(1)
          }

          const version = match[2] ? `${match[1]}-rc.${match[2]}` : match[1]
          const pkgPath = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))
          pkg.version = version
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`)

          if (process.env.GITHUB_ENV) {
            fs.appendFileSync(process.env.GITHUB_ENV, `DESKTOP_VERSION=${version}\n`)
            fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_CHANNEL=${match[2] ? 'rc' : 'latest'}\n`)
          }

          console.log(`Set ${pkgPath} version to ${version} from tag ${tag}`)
          EOF

      - name: Show resolved standalone version
        run: echo "Standalone version = ${{ env.DESKTOP_VERSION }}"

      - name: Build macOS standalone artifacts
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac -- -c.publish.provider=github -c.publish.owner=MIRA-Intelligence -c.publish.repo=mira-ui -c.publish.channel=${{ env.RELEASE_CHANNEL }}

      - name: Build Windows standalone artifacts
        if: matrix.os == 'windows-latest'
        # Quote dotted options; keep native Windows tar on PATH for bundles.
        shell: pwsh
        run: npm run dist:win -- '-c.publish.provider=github' '-c.publish.owner=MIRA-Intelligence' '-c.publish.repo=mira-ui' '-c.publish.channel=${{ env.RELEASE_CHANNEL }}'

      - name: Package Windows standalone setup as zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $setupExe = Get-ChildItem -Path release -Filter "MIRA-standalone-*-win-*-setup.exe" | Select-Object -First 1
          if (-not $setupExe) {
            Write-Error "Standalone setup executable not found in release/"
            exit 1
          }
          $setupZip = [System.IO.Path]::ChangeExtension($setupExe.FullName, ".zip")
          Compress-Archive -Path $setupExe.FullName -DestinationPath $setupZip -Force

      - name: Upload macOS standalone release assets
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: miraui-release-standalone-macos
          path: release/MIRA-standalone-*-mac-*.dmg
          if-no-files-found: error

      - name: Upload Windows standalone release assets
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: miraui-release-standalone-windows
          path: release/MIRA-standalone-*-win-*-setup.zip
          if-no-files-found: error

  build-bundle:
    needs: verify-compatibility
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    env:
      MIRA_ENGINE_REPO: MIRA-Intelligence/mira

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align bundle version with release tag
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('fs')

          const tag = process.env.RELEASE_TAG || ''
          const match = /^v(\d+\.\d+\.\d+)(?:rc(\d+))?$/.exec(tag)
          if (!match) {
            console.error(`Unsupported tag format: "${tag}". Expected vX.Y.Z or vX.Y.ZrcN.`)
            process.exit(1)
          }

          const version = match[2] ? `${match[1]}-rc.${match[2]}` : match[1]
          const pkgPath = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))
          pkg.version = version
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`)

          if (process.env.GITHUB_ENV) {
            fs.appendFileSync(process.env.GITHUB_ENV, `DESKTOP_VERSION=${version}\n`)
            fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_CHANNEL=${match[2] ? 'rc' : 'latest'}\n`)
          }

          console.log(`Set ${pkgPath} version to ${version} from tag ${tag}`)
          EOF

      - name: Pin bundled engine to compatibility release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ENGINE_TAG="v$(node -p "require('./compatibility.json').agent")"
          gh release view "$ENGINE_TAG" --repo "$MIRA_ENGINE_REPO" --json tagName,isDraft,assets
          echo "MIRA_ENGINE_RELEASE_TAG=$ENGINE_TAG" >> "$GITHUB_ENV"
          echo "Bundle version = $DESKTOP_VERSION using pinned engine $ENGINE_TAG"

      - name: Build macOS bundle artifacts
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ github.token }}
          MIRA_FEISHU_WEBHOOK_URL: ${{ secrets.MIRA_FEISHU_WEBHOOK_URL }}
          MIRA_FEISHU_WEBHOOK_SECRET: ${{ secrets.MIRA_FEISHU_WEBHOOK_SECRET }}
          MIRA_FEISHU_GROUP_INVITE_URL: ${{ secrets.MIRA_FEISHU_GROUP_INVITE_URL }}
          MIRA_FEISHU_MENTION_OPEN_ID: ${{ secrets.MIRA_FEISHU_MENTION_OPEN_ID }}
          MIRA_FEISHU_MENTION_NAME: ${{ vars.MIRA_FEISHU_MENTION_NAME || 'MIRAI' }}
        run: npm run dist:bundle:mac -- -c.publish.provider=github -c.publish.owner=MIRA-Intelligence -c.publish.repo=mira-ui -c.publish.channel=${{ env.RELEASE_CHANNEL }}

      - name: Build Windows bundle artifacts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MIRA_FEISHU_WEBHOOK_URL: ${{ secrets.MIRA_FEISHU_WEBHOOK_URL }}
          MIRA_FEISHU_WEBHOOK_SECRET: ${{ secrets.MIRA_FEISHU_WEBHOOK_SECRET }}
          MIRA_FEISHU_GROUP_INVITE_URL: ${{ secrets.MIRA_FEISHU_GROUP_INVITE_URL }}
          MIRA_FEISHU_MENTION_OPEN_ID: ${{ secrets.MIRA_FEISHU_MENTION_OPEN_ID }}
          MIRA_FEISHU_MENTION_NAME: ${{ vars.MIRA_FEISHU_MENTION_NAME || 'MIRAI' }}
        run: npm run dist:bundle:win -- '-c.publish.provider=github' '-c.publish.owner=MIRA-Intelligence' '-c.publish.repo=mira-ui' '-c.publish.channel=${{ env.RELEASE_CHANNEL }}'

      - name: Package Windows bundle setup as zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $setupExe = Get-ChildItem -Path release-bundle -Filter "MIRA-bundle-*-win-*-setup.exe" | Select-Object -First 1
          if (-not $setupExe) {
            Write-Error "Bundle setup executable not found in release-bundle/"
            exit 1
          }
          $setupZip = [System.IO.Path]::ChangeExtension($setupExe.FullName, ".zip")
          Compress-Archive -Path $setupExe.FullName -DestinationPath $setupZip -Force

      - name: Upload macOS bundle release assets
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: miraui-release-bundle-macos
          path: release-bundle/MIRA-bundle-*-mac-*.dmg
          if-no-files-found: error

      - name: Upload Windows bundle release assets
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: miraui-release-bundle-windows
          path: release-bundle/MIRA-bundle-*-win-*-setup.zip
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-standalone
      - build-bundle
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: miraui-release-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: MIRA ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, 'rc') }}
          make_latest: ${{ contains(env.RELEASE_TAG, 'rc') && 'false' || 'true' }}
          generate_release_notes: true
          # One installer per platform: macOS .dmg, Windows setup .zip.
          files: |
            release-assets/*.dmg
            release-assets/*-setup.zip
