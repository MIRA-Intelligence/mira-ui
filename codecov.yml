coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "src/**/*.test.{ts,tsx}"
  - "src/test/**"
  - "src/types/**"
  - "src/main.tsx"
  - "src/vite-env.d.ts"
